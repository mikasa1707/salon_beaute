@if (document) {
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between">
      <strong>
        {{ document.title }}
      </strong>

      <div>
        <button class="btn btn-sm btn-secondary me-2" (click)="print()">
          <i class="fa fa-print"></i>

          Imprimer
        </button>

        <button class="btn btn-sm btn-danger me-2" (click)="pdf()">PDF</button>

        <button class="btn btn-sm btn-success" (click)="excel()">Excel</button>
      </div>
    </div>

    <div class="card-body">
      <iframe style="width: 100%; height: 600px; border: 0" [srcdoc]="document.html"></iframe>
    </div>
  </div>
}
